[project]
name = "simple-bot"
version = "0.1.0"
description = "Simplified multi-module Telegram bot with captcha gate"
requires-python = "==3.14.*"
dependencies = [
    "pytelegrambotapi>=4.27.0,<5",
    "aiohttp>=3.10.5,<4",
    "peewee>=3.17.0,<4",
    "psutil>=5.9,<7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportIncompatibleVariableOverride = "none"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.9.0",
]
